version: 2

# =====================================================================
# TESTES DA CAMADA SILVER — qualidade de dados como CÓDIGO EXECUTÁVEL
# =====================================================================
# Cada teste vira uma consulta SQL que procura VIOLAÇÕES. Se ela
# retorna alguma linha, o teste falha.
#
# Exemplo: o teste `not_null` em processo_id compila para
#     select processo_id from stg_processos where processo_id is null
# Nada de mágico — dá para ver o SQL gerado em dbt/target/compiled/.
#
# ⚠ Diferença importante:
#   pytest    -> testa o CÓDIGO (a ingestão se comporta como esperado?)
#   dbt test  -> testa os DADOS (eles respeitam as regras declaradas?)
# =====================================================================

models:
  - name: stg_processos
    description: >
      Processos tipados, deduplicados e com datas normalizadas.
      É a base de tudo: se algo estiver errado aqui, contamina a Gold.
    columns:
      - name: processo_id
        description: Identificador único do processo (chave natural).
        tests:
          - not_null   # o registro sem id foi filtrado no modelo
          - unique     # as duplicatas integrais foram removidas
      - name: data_distribuicao
        description: Data em que o processo foi distribuído.
        tests:
          - not_null   # passa graças ao tratamento dos dois formatos de data
      - name: situacao
        description: Situação do processo na origem.
        tests:
          # accepted_values garante que a origem não invente valores novos.
          # Se amanhã aparecer "Suspenso", o teste falha e nós ficamos
          # sabendo — em vez de descobrir por um relatório errado.
          - accepted_values:
              arguments:
                values: ['Baixado', 'Em andamento']

  - name: stg_comarcas
    description: Cadastro de comarcas com nomes padronizados.
    columns:
      - name: comarca_id
        tests:
          - not_null
          - unique

  - name: stg_classes
    description: Classes processuais deduplicadas (um registro por classe_id).
    columns:
      - name: classe_id
        tests:
          - not_null
          # este `unique` é a prova de que a deduplicação funcionou:
          # sem o row_number() do modelo, ele falharia
          - unique

  - name: stg_movimentacoes
    description: Eventos de movimentação processual, deduplicados.
    columns:
      - name: processo_id
        tests:
          - not_null
      - name: data_movimento
        tests:
          - not_null
