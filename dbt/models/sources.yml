version: 2

# source() = dados que ENTRAM no domínio do dbt (produzidos pela ingestão Python).
# ref()    = dependência entre modelos produzidos PELO PRÓPRIO dbt.
# É com source() e ref() que o dbt descobre a DAG do projeto.
sources:
  - name: bronze
    description: >
      Camada Bronze: Parquet gravado pela ingestão (Python + Pandas),
      preservando os dados próximos à origem. O dbt-duckdb lê os
      arquivos diretamente via external_location — não é preciso
      carregar nada num servidor de banco.
    tables:
      - name: processos
        description: Processos judiciais capturados do sistema transacional (CSV).
      - name: comarcas
        description: Cadastro de comarcas (CSV).
      - name: classes
        description: Cadastro de classes processuais (CSV).
      - name: movimentacoes
        description: Eventos de movimentação processual (JSON). Só existe após o desafio de ingestão.
    config:
      meta:
        # external_location é o que permite ao DuckDB ler o Parquet
        # DIRETO do disco — sem carregar nada para dentro do banco.
        # {name} é substituído pelo nome de cada tabela abaixo.
        external_location: "../data/bronze/{name}.parquet"
